<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ניהול התראות מחיר</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0f15;
      color: #dbe5ee;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .sub { color: #8b9aab; font-size: 14px; margin-bottom: 24px; }
    .card {
      background: #121a22;
      border: 1px solid rgba(90,169,204,.18);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 13px; color: #8b9aab; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(90,169,204,.25);
      background: #0a0f15;
      color: #dbe5ee;
      font-size: 15px;
      margin-bottom: 14px;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #5aa9cc; color: #0a0f15; }
    .btn-danger { background: #c44; color: white; margin-top: 8px; }
    .btn-sync { background: #2ecc71; color: #0a0f15; margin-top: 12px; }
    .btn-save-token { background: #5aa9cc; color: #0a0f15; margin-top: 8px; }
    .alert-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(90,169,204,.12);
    }
    .alert-item:last-child { border-bottom: none; }
    .status { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 14px; display: none; }
    .status.ok { background: rgba(46,204,113,.15); color: #2ecc71; display: block; }
    .status.err { background: rgba(204,68,68,.15); color: #ff6b6b; display: block; }
    .token-box { margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ניהול התראות מחיר</h1>
    <p class="sub">ההתראות מסונכרנות ישירות לטלגרם דרך GitHub</p>

    <!-- הגדרת טוקן -->
    <div class="card token-box">
      <h3 style="margin-bottom:12px;font-size:16px">הגדרת Token</h3>
      <label>GitHub Personal Access Token</label>
      <input type="password" id="tokenInput" placeholder="הדבק כאן את הטוקן">
      <button class="btn-save-token" onclick="saveToken()">שמור Token</button>
      <div id="tokenStatus" style="margin-top:10px;font-size:13px;color:#8b9aab"></div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:14px;font-size:16px">הוספת התראה חדשה</h3>
      
      <label>סימול (לדוגמה NVDA)</label>
      <input type="text" id="symbol" placeholder="NVDA" style="text-transform:uppercase">

      <label>מחיר יעד</label>
      <input type="number" id="price" placeholder="230.00" step="0.01">

      <label>כיוון</label>
      <select id="direction">
        <option value="both">בכל כיוון (Crossing)</option>
        <option value="above">רק עלייה מעל היעד</option>
        <option value="below">רק ירידה מתחת ליעד</option>
      </select>

      <label>הערה (אופציונלי)</label>
      <input type="text" id="note" placeholder="פריצה / תמיכה וכו'">

      <button class="btn-primary" onclick="addAlert()">הוסף התראה</button>
    </div>

    <div class="card">
      <h3 style="margin-bottom:14px;font-size:16px">התראות פעילות</h3>
      <div id="alertsList">טוען...</div>
    </div>

    <button class="btn-sync" onclick="syncToGitHub()">סנכרן לטלגרם עכשיו</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const REPO_OWNER = 'roiroiroi200-sudo';
    const REPO_NAME = 'price_alert';
    const FILE_PATH = 'alerts.json';

    let alerts = [];

    function getToken() {
      return localStorage.getItem('gh_token') || '';
    }

    function saveToken() {
      const token = document.getElementById('tokenInput').value.trim();
      if (!token.startsWith('ghp_')) {
        showStatus('טוקן לא תקין', true);
        return;
      }
      localStorage.setItem('gh_token', token);
      document.getElementById('tokenStatus').textContent = '✓ Token נשמר בהצלחה';
      document.getElementById('tokenStatus').style.color = '#2ecc71';
      loadAlerts();
    }

    async function loadAlerts() {
      const token = getToken();
      if (!token) {
        document.getElementById('alertsList').innerHTML = '<span style="color:#8b9aab">יש להזין Token קודם</span>';
        return;
      }

      try {
        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
          headers: { Authorization: `token ${token}` }
        });
        if (!res.ok) throw new Error('לא הצלחתי לטעון את הקובץ');
        const data = await res.json();
        const content = JSON.parse(atob(data.content));
        alerts = Array.isArray(content) ? content : [];
        renderAlerts();
      } catch (e) {
        document.getElementById('alertsList').innerHTML = `<span style="color:#ff6b6b">${e.message}</span>`;
      }
    }

    function renderAlerts() {
      const list = document.getElementById('alertsList');
      if (alerts.length === 0) {
        list.innerHTML = '<div style="color:#8b9aab">אין התראות עדיין</div>';
        return;
      }
      list.innerHTML = alerts.map((a, i) => `
        <div class="alert-item">
          <div>
            <strong>${a.symbol}</strong> @ ${a.price}
            <div style="font-size:12px;color:#8b9aab">${a.direction || 'both'} ${a.note ? '· ' + a.note : ''}</div>
          </div>
          <button class="btn-danger" style="width:auto;padding:8px 12px;font-size:13px" onclick="removeAlert(${i})">מחק</button>
        </div>
      `).join('');
    }

    function addAlert() {
      const symbol = document.getElementById('symbol').value.trim().toUpperCase();
      const price = parseFloat(document.getElementById('price').value);
      const direction = document.getElementById('direction').value;
      const note = document.getElementById('note').value.trim();

      if (!symbol || isNaN(price)) {
        showStatus('נא למלא סימול ומחיר תקינים', true);
        return;
      }

      alerts.push({ symbol, price, direction, note });
      renderAlerts();
      document.getElementById('symbol').value = '';
      document.getElementById('price').value = '';
      document.getElementById('note').value = '';
      showStatus('התראה נוספה (עדיין לא סונכרנה)', false);
    }

    function removeAlert(index) {
      alerts.splice(index, 1);
      renderAlerts();
    }

    async function syncToGitHub() {
      const token = getToken();
      if (!token) {
        showStatus('יש להזין Token קודם', true);
        return;
      }

      showStatus('מסנכרן...', false);
      try {
        const getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
          headers: { Authorization: `token ${token}` }
        });
        const fileData = await getRes.json();
        const sha = fileData.sha;

        const content = btoa(unescape(encodeURIComponent(JSON.stringify(alerts, null, 2))));

        const putRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            Authorization: `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Update alerts from manager',
            content: content,
            sha: sha
          })
        });

        if (!putRes.ok) {
          const err = await putRes.json();
          throw new Error(err.message || 'שגיאה בסנכרון');
        }

        showStatus('סונכרן בהצלחה! ההתראות יבדקו בריצה הבאה', false);
      } catch (e) {
        showStatus('שגיאה: ' + e.message, true);
      }
    }

    function showStatus(msg, isError) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + (isError ? 'err' : 'ok');
    }

    // טעינה
    if (getToken()) {
      document.getElementById('tokenStatus').textContent = '✓ Token כבר שמור';
      document.getElementById('tokenStatus').style.color = '#2ecc71';
      loadAlerts();
    }
  </script>
</body>
</html>
